name: Validate agent context

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-agent-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate structured context
        run: python scripts/validate_agent_context.py
