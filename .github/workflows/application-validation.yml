name: Validate application V1
on:
  pull_request:
    paths-ignore:
      - 'docs/09_BANCO_DE_DADOS/**'
      - 'docs/11_ENTREGA_SQL_EER/**'
      - 'database/mysql/**'
      - 'entrega/sql-eer/**'
      - 'scripts/prepare_sql_eer_delivery.mjs'
      - 'scripts/verify_mysql_sql_eer.mjs'
      - '.github/workflows/sql-eer-delivery.yml'
      - '.github/workflows/application-validation.yml'
      - 'AGENTS.md'
      - 'docs/10_IMPLEMENTACAO/CODEX_PLAYBOOK.md'
      - 'docs/10_IMPLEMENTACAO/README.md'
  push:
    branches: [main, feat/infra-scaffold-v1]
    paths-ignore:
      - 'docs/09_BANCO_DE_DADOS/**'
      - 'docs/11_ENTREGA_SQL_EER/**'
      - 'database/mysql/**'
      - 'entrega/sql-eer/**'
      - 'scripts/prepare_sql_eer_delivery.mjs'
      - 'scripts/verify_mysql_sql_eer.mjs'
      - '.github/workflows/sql-eer-delivery.yml'
      - '.github/workflows/application-validation.yml'
      - 'AGENTS.md'
      - 'docs/10_IMPLEMENTACAO/CODEX_PLAYBOOK.md'
      - 'docs/10_IMPLEMENTACAO/README.md'

permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # O ensaio MySQL autorizado e executado no Fedora; CI padrao permanece fechado.
      REGISTRATION_ENVIRONMENT: ""
      AUTH_ENVIRONMENT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Audit runtime dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
