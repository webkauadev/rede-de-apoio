name: Requisito RF/RNF
description: Registrar ou formalizar um requisito canônico no GitHub.
title: "[RF/RNF] "
body:
  - type: markdown
    attributes:
      value: |
        Este formulário registra requisitos na fonte única operacional do projeto. Propostas devem ser identificadas explicitamente como proposta.

  - type: dropdown
    id: kind
    attributes:
      label: Tipo
      options:
        - RF — Requisito Funcional
        - RNF — Requisito Não Funcional
        - Proposta de RF
        - Proposta de RNF
    validations:
      required: true

  - type: input
    id: requirement_id
    attributes:
      label: Identificador
      placeholder: RF11 ou RNF01
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: Nome curto
      placeholder: Diário de cuidados
    validations:
      required: true

  - type: textarea
    id: definition
    attributes:
      label: Definição canônica
      description: Descreva o comportamento/qualidade sem ambiguidade operacional.
    validations:
      required: true

  - type: textarea
    id: criteria
    attributes:
      label: Critérios e restrições
      description: Inclua condições verificáveis, limites, permissões ou métricas quando aplicável.
    validations:
      required: true

  - type: textarea
    id: related_stories
    attributes:
      label: User Stories relacionadas
      description: Liste US-0NN existentes ou indique que ainda não foram derivadas.

  - type: input
    id: owner
    attributes:
      label: Responsável
    validations:
      required: true

  - type: textarea
    id: traceability
    attributes:
      label: Telas, elementos e decisões relacionadas
      placeholder: T06, E12, RN-005
