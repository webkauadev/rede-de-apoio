resolution_policy:
  order:
    - local_approved_component
    - existing_obra_shadcn_component
    - linked_library_component
    - new_local_component
  rules:
    - "Search before creating."
    - "Use semantic instances instead of drawing equivalent primitives."
    - "Do not detach an instance unless the design requirement cannot be expressed through its properties/variants."
    - "When an exact Figma node is unknown, resolve it from current screens or the design system before mutation."

