schema_version: 2
last_updated: '2026-09-14'
resolution_policy:
  order: [local_approved_component, existing_obra_shadcn_component, linked_library_component, new_local_component]
  rules:
  - Search before creating.
  - Use semantic instances instead of drawing equivalent primitives.
  - Do not detach an instance unless the design requirement cannot be expressed through its properties/variants.
  - When an exact component node is unknown, search the mapped Obra/shadcn page or inspect approved screen instances before mutation.
  - Observed semantic usage below does not prove an exact main-component ID; inspect the current frame before mutation.
  - When a migrated state is cloned from legacy visual evidence, reapply current semantic bindings; do not preserve stale color overrides merely because they existed in the old state.
