new_component_gate:
  required_questions:
    - "Does an equivalent component already exist in current approved screens?"
    - "Does Obra/shadcn provide the semantic component?"
    - "Can an existing component variant/property express this state?"
    - "Will this component be reused or does it represent a stable domain concept?"
  allow_creation_only_if: "No approved semantic equivalent exists and the need is justified by the screen requirements."
  after_creation:
    - "Name semantically."
    - "Use Auto Layout where structural."
    - "Bind existing tokens/styles when available."
    - "Document purpose/usage."
    - "Register the new component in this file."
