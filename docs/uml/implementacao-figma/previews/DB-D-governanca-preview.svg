<text x="129" y="979" font-family="Arial,Helvetica,sans-serif" font-size="16.5" font-weight="400" text-anchor="start" fill="#52636C">Nota: usuario e rede_cuidado são as mesmas tabelas físicas, repetidas visualmente para reduzir cruzamentos.</text>
<text x="129" y="1001" font-family="Arial,Helvetica,sans-serif" font-size="16.2" font-weight="400" text-anchor="start" fill="#52636C">Auditoria também referencia pessoa_idosa (FK opcional). Preferências: N03/N04; entregas técnicas: N01–N04. UNIQUE/CHECK no SQL.</text>
<text x="110" y="1043" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#6B7780">PRÉVIA VETORIAL PARA IMPORTAÇÃO · Não é frame do Figma · Modelo EER original permanece inalterado</text>
