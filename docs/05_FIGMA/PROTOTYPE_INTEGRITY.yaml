resolved_functional_decisions:
  P03:
    issue: 75
    status: closed_completed
    affects: [T06, T07]
    rule: Correction is allowed to a user with current effective permission to produce the same record type; original record remains immutable.
  P04:
    issue: 76
    status: closed_completed
    affects: [T03, T04, T05, T07, T16]
    rule: N01-N04 use transient global AppShell feedback and existing contextual destinations; no notification center.
  P05:
    issue: 77
    status: closed_completed
    affects: [T07]
    rule: CSV export is restricted to Familiar Principal in the first version and is audited.
  P06:
    issue: 78
    status: closed_completed
    affects: [T13]
    rule: Effective accumulated-family-role permission is the union of positive permissions, preserving explicit contextual/security/privacy restrictions.
  RF30_US036:
    issues: [34, 72]
    status: approved
    affects: [T01, T02, T12]
    rule: Elderly own access is same-app read-only access with no write/admin/export capability.

