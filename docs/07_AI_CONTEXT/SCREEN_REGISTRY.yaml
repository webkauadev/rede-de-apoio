global_visual_direction:
  reference: Material Design 3
  role: ux_principles_not_component_library
  implementation: Obra/shadcn/local components with Rede de Apoio identity
  foundation_gate: navigation_foundation_revision_required_before_authenticated_screen_migration
  deprecated_for_new_migrations: [t06_header_person_as_global_header, current_five_item_compFooter]
  target_primary_navigation: [Home, Agenda, Diário, Saúde]
  target_secondary_surface: settings_management_sheet
  settings_destinations: [T12, T13, T14, T15, T16, T17]
  first_root_shell_validation_after_foundation: T03
  auth_shell_screens: [T01, T02]
selection_policy:
  next_screen_for_owner:
  - Prefer a screen explicitly requested by the user.
  - Before any authenticated-screen migration, check global_visual_direction.foundation_gate and FIGMA_REGISTRY foundation status.
  - While the gate is active, revise the Design Foundation instead of propagating the deprecated header/footer.
  - Otherwise follow owner_sequences, prioritizing open integrity debt before redesign.
  - Resolve RF/RNF/US from the GitHub registries before changing functional scope.
  - A Figma reaction is evidence of current prototype behavior, not a functional requirement.
  - Known broken reactions in PROTOTYPE_INTEGRITY.yaml must never be treated as intended behavior.
  - RF30/US-036 are proposal-only and cannot drive approved read-only scope until explicitly approved.
  status_values:
  - figma_mapped
