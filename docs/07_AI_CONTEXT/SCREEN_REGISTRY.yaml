schema_version: 4
last_updated: '2026-09-14'
sources:
  requirements:
    system: GitHub
    repository: webkauadev/rede-de-apoio
    docs: docs/01_REQUIREMENTS
    issue_registry: docs/06_GITHUB/ISSUE_REGISTRY.yaml
    role: canonical_source_of_truth
    missing_data_policy: migration_required
  figma: docs/05_FIGMA/FIGMA_REGISTRY.yaml
  prototype_integrity: docs/05_FIGMA/PROTOTYPE_INTEGRITY.yaml
  sitemap: docs/03_INFORMATION_ARCHITECTURE/SITEMAP.md
  traceability: docs/03_INFORMATION_ARCHITECTURE/TRACEABILITY_MATRIX.md

visual_architecture:
  authority: Material Design 3
  canonical_figma_page: {node_id: '5926:1014', name: Fluxo Final}
  primary_navigation: [Home, Agenda, Diário, Saúde]
  secondary_surface: Settings / Management Sheet
  settings_destinations: [T12, T13, T14, T15, T16, T17]
  auth_shell_screens: [T01, T02]
  touch_target_min_px: 48
  state_rule: STATE = PAGE BASE + DELTA MÍNIMO

selection_policy:
  - Prefer a screen explicitly requested by the user.
  - Resolve RF/RNF/US from GitHub before changing functional scope.
  - Use Fluxo Final as current visual/prototype authority when an equivalent exists.
  - Owner pages are historical/migration evidence when an equivalent Fluxo Final node exists.
  - A Figma reaction is not a requirement.
  - P03/P04/P05/P06 were resolved canonically on 2026-09-14.
  - RF30/US-036 were approved canonically on 2026-09-14.
  - P01/#73 was resolved on 2026-09-15; acceptance criteria for US-001-US-036 are in docs/01_REQUIREMENTS/ACCEPTANCE_CRITERIA.yaml.

