agent_rule: GitHub is canonical for behavior and scope. Fluxo Final is canonical for current visual/prototype implementation. P01-P06 and RF30/US-036 are approved/closed decisions; no documentary gate remains open. Material 3 governs UX roles without replacing project requirements.
