state_rule: STATE = PAGE BASE + DELTA MÍNIMO
authority_rules:
- State existence in Figma documents visual evidence, not automatic product approval.
- proposal_only states cannot be used to expand approved scope.
- visual_candidate_only states cannot resolve an open functional/documental gate.
- prototype_integrity references identify owner-page reactions/names that must not be treated as intended behavior.
- migrated_figma_node on an open migration PR is visual migration evidence until explicit human approval and merge.
- final_prototype_node references are canonical copies for end-user prototype validation and do not change requirement authority.
