state_rule: STATE = PAGE BASE + DELTA MÍNIMO
authority_rules:
- State existence in Figma documents visual evidence, not automatic product approval.
- proposal_only states cannot be used to expand approved scope.
- visual_candidate_only states cannot resolve an open functional/documental gate.
- prototype_integrity references identify current reactions/names that must not be treated as intended behavior.
- migrated_figma_node on an open migration PR is a visual migration candidate until explicit human approval and merge.
