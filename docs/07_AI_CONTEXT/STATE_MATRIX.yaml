schema_version: 1
last_updated: 2026-09-08

principles:
  - "A state is a variation of the same screen, not an independent visual concept."
  - "Preserve shell, navigation, width and unaffected component geometry between sibling states."
  - "Only change the minimum region required to communicate behavior."
  - "Use exact current Figma nodes when mapped; discover and register before editing when unmapped."

state_semantics:
  default:
    inherits: null
    rule: canonical_structure
  normal:
    inherits: null
    rule: canonical_data_structure
  loading:
    inherits: base
    preserve:
      - shell
      - navigation
      - page_width
      - stable_geometry
    change_only:
      - data_dependent_content
      - action_pending_feedback
  empty:
    inherits: normal
    preserve:
      - shell
      - navigation
      - page_width
      - context_header
    change_only:
      - data_region
      - empty_message
      - applicable_cta
  validation_error:
    inherits: default
    preserve:
      - form_structure
      - valid_values
      - navigation
      - page_width
    change_only:
      - invalid_control_state
      - field_message
      - form_feedback
  error:
    inherits: base
    preserve:
      - shell
      - navigation
      - page_width
    change_only:
      - affected_region
      - error_feedback
  success:
    inherits: base
    preserve:
      - shell
      - navigation
      - unaffected_content
      - page_width
    change_only:
      - affected_content
      - success_feedback
  forbidden:
    inherits: base
    rule: "Preserve enough context to orient the user while removing unauthorized actions/data."

